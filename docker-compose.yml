
services:
  db:
    image: postgres:16-alpine
    container_name: marketing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketing_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketing_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-marketing_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketing_user} -d ${POSTGRES_DB:-marketing_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketing-ai-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-marketing-ai-super-secret-key-2026}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-marketing_user}:${POSTGRES_PASSWORD:-marketing_secret_pass}@db:5432/${POSTGRES_DB:-marketing_db}
      - UPLOAD_FOLDER=app/static/uploads
      - GENERATED_FOLDER=app/static/generated
      - MAX_CONTENT_LENGTH=16777216
    volumes:
      - uploads_data:/app/app/static/uploads
      - generated_data:/app/app/static/generated
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  generated_data:
    driver: local
